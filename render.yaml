services:
  - type: web
    name: fcce-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fcce-postgres
          property: connectionString
      - key: FCCE_SITE_URL
        sync: false

  - type: postgres
    name: fcce-postgres
    plan: free
